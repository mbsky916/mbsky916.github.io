  author: "地平线"
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false
  giscus:
    repo: "mbsky916/mbsky916.github.io"
    repoID: "R_kgDOM21I2g"
    category: "Announcements"
    categoryID: "DIC_kwDOM21I2s4Ci5Hr"
    mapping: "pathname"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    theme: "preferred_color_scheme"
    lang: "zh-CN"
    crossorigin: "anonymous"
  label:
    text: "地平线"
    icon: "/logo.png"
    iconHeight: 35
  homeInfoParams:

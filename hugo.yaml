baseURL: "https://horizonzhao.netlify.app/"
title: "地平线 | Horizon"
locale: "zh-cn"
defaultContentLanguage: "zh"
theme: "papermod"
enableRobotsTXT: true
enableEmoji: true
paginate: 10

params:

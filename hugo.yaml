baseURL: "https://horizonzhao.netlify.app/"
title: "地平线 | Horizon"
locale: "zh-cn"
theme: "paged"
enableRobotsTXT: true
enableEmoji: true
paginate: 10

params:
  description: "记录所思所想及日常。所行即所愿。"
  author:
    posts: "地平线"
    summary: "地平线"
    about: "地平线"
  footer: "&copy; [地平线](https://horizonzhao.netlify.app) 2024 - {Year} · 所行即所愿"
  logo:
    en:
      alt: "地平线"
      img: "/images/logo.png"

menu:
  main:
    - name: 首页
      url: /
      weight: 1
    - name: 日志
      url: /posts/
      weight: 2
    - name: 总结
      url: /summary/
      weight: 3
    - name: 关于
      url: /about/
      weight: 4
    - name: 搜索
      url: /search/
      weight: 5

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
